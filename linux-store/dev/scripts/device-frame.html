<!doctype html>
<meta charset="utf-8">
<title>Device frame</title>
<style>
  body { margin: 0; background: #111; display: flex; gap: 24px; padding: 20px; align-items: flex-start; font-family: system-ui; color: #999; }
  .phone { display: grid; gap: 6px; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 44px; background: #000; box-shadow: 0 0 0 10px #222, 0 30px 60px rgba(0,0,0,.6); }
  body.desktop iframe { width: 1280px; height: 800px; border-radius: 16px; }
  small { text-align: center; font-size: 12px; }
</style>
<div class="phone"><iframe id="a" src="/"></iframe><small>/</small></div>
<div class="phone"><iframe id="b" src="/products/hoodie-sada-white"></iframe><small>/products</small></div>
<div class="phone"><iframe id="c" src="/collections/winter-collection"></iframe><small>/collections</small></div>
<script>
  // ?a=/path&b=/path&c=/path picks the pages; ?desktop=1 uses a 1280px frame;
  // ?run=<js> is evaluated inside each frame once loaded (same-origin).
  const q = new URLSearchParams(location.search);
  if (q.get('desktop')) document.body.classList.add('desktop');
  ['a', 'b', 'c'].forEach((id) => {
    const f = document.getElementById(id);
    const u = q.get(id);
    if (u === '') { f.parentElement.remove(); return; }
    if (u) { f.src = u; f.nextElementSibling.textContent = u; }
    const js = q.get('run');
    if (js) f.addEventListener('load', () => { try { f.contentWindow.eval(js); } catch (e) { console.error(id, e); } });
  });
</script>
